---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: togliattis.bruner.dev
spec:
  group: bruner.dev
  names:
    categories:
    - brunernetes
    kind: Togliatti
    listKind: TogliattiList
    plural: togliattis
    shortNames:
    - tgl
    - factory
    singular: togliatti
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.nodeName
      name: Node
      type: string
    - jsonPath: .status.kubernetesVersion
      name: Kubernetes
      type: string
    - jsonPath: .status.activeCapacityProfile
      name: Capacity
      type: string
    - jsonPath: .status.conditions[?(@.type=="NodeReady")].status
      name: Node ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Available")].status
      name: Available
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Togliatti represents the single-node factory environment: the Kubernetes API,
          the node, the container runtime, the pod network and the resources available
          to build products on.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: TogliattiSpec describes the single-node factory environment
              to observe.
            properties:
              capacityProfile:
                description: |-
                  CapacityProfile requests a capacity profile. When empty the controller
                  derives it from the observed node capacity.
                enum:
                - compact
                - standard
                - spacious
                type: string
              expectedKubernetesVersion:
                description: |-
                  ExpectedKubernetesVersion is the pinned control-plane version the
                  installer produced, for example "v1.32.3". A mismatch is reported but
                  does not stop the line.
                pattern: ^v[0-9]+\.[0-9]+\.[0-9]+$
                type: string
              expectedRuntime:
                default: containerd
                description: ExpectedRuntime is the container runtime the installer
                  configured.
                enum:
                - containerd
                type: string
              nodeName:
                description: |-
                  NodeName is the node that hosts the factory. When empty the controller
                  uses the only node in the cluster.
                type: string
              probeIntervalSeconds:
                default: 60
                description: ProbeIntervalSeconds is how often the environment is
                  re-checked.
                format: int32
                maximum: 3600
                minimum: 10
                type: integer
            type: object
          status:
            description: TogliattiStatus reports the observed state of the factory
              environment.
            properties:
              activeCapacityProfile:
                description: ActiveCapacityProfile is the capacity profile in use.
                enum:
                - compact
                - standard
                - spacious
                type: string
              conditions:
                description: |-
                  Conditions maintains APIHealthy, NodeReady, RuntimeAvailable,
                  CNIHealthy, LocalEndpointCapable and Available.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              containerRuntime:
                description: |-
                  ContainerRuntime is the runtime reported by the node, for example
                  "containerd://1.7.24".
                type: string
              kubernetesVersion:
                description: KubernetesVersion is the kubelet version reported by
                  the node.
                type: string
              lastProbeTime:
                description: LastProbeTime is when the environment was last checked.
                format: date-time
                type: string
              localEndpointCapable:
                description: |-
                  LocalEndpointCapable reports whether loopback host port publishing is
                  available on this node.
                type: boolean
              nodeName:
                description: NodeName is the observed node.
                type: string
              observedGeneration:
                description: ObservedGeneration is the spec generation the status
                  refers to.
                format: int64
                type: integer
              resources:
                description: Resources reports node capacity and allocatable resources.
                properties:
                  cpuAllocatable:
                    description: CPUAllocatable is the allocatable CPU.
                    type: string
                  cpuCapacity:
                    description: CPUCapacity is the total CPU capacity, for example
                      "2".
                    type: string
                  ephemeralStorageAllocatable:
                    description: EphemeralStorageAllocatable is the allocatable ephemeral
                      storage.
                    type: string
                  memoryAllocatable:
                    description: MemoryAllocatable is the allocatable memory.
                    type: string
                  memoryCapacity:
                    description: MemoryCapacity is the total memory, for example "4Gi".
                    type: string
                  pods:
                    description: Pods is the maximum number of pods the node accepts.
                    format: int64
                    type: integer
                type: object
              schedulableForWorkloads:
                description: |-
                  SchedulableForWorkloads reports whether ordinary workloads may run on the
                  control-plane node, which a single-node factory requires.
                type: boolean
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
