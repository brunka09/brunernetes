---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: konveers.bruner.dev
spec:
  group: bruner.dev
  names:
    categories:
    - brunernetes
    kind: Konveer
    listKind: KonveerList
    plural: konveers
    shortNames:
    - kvr
    - line
    singular: konveer
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.appRef
      name: App
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.appliedImage
      name: Image
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Konveer is a lightweight delivery workflow for an existing container image.
          It validates the image reference and the factory policy, applies the
          referenced BrunerApp, waits for the rollout and readiness, and verifies the
          loopback endpoint where that is possible.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              KonveerSpec describes a lightweight delivery workflow for an image that
              already exists in a registry. Brunernetes never builds container images.
            properties:
              appRef:
                description: |-
                  AppRef is the name of the BrunerApp in the same namespace that this
                  workflow delivers to. The BrunerApp is created when it does not exist.
                maxLength: 253
                minLength: 1
                type: string
              appTemplate:
                description: |-
                  AppTemplate carries optional BrunerApp spec fields applied together with
                  the image. Fields left empty keep the current value of the BrunerApp.
                properties:
                  healthPath:
                    description: HealthPath overrides the probe path.
                    pattern: ^/.*$
                    type: string
                  localExposure:
                    description: LocalExposure overrides the loopback exposure configuration.
                    properties:
                      enabled:
                        default: true
                        description: |-
                          Enabled requests a host port binding on the loopback interface in
                          addition to the always-created ClusterIP Service.
                        type: boolean
                      hostIP:
                        default: 127.0.0.1
                        description: HostIP is the loopback address the application
                          is bound to.
                        pattern: ^127\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$
                        type: string
                      hostPort:
                        default: 30080
                        description: HostPort is the loopback port the application
                          is published on.
                        format: int32
                        maximum: 65535
                        minimum: 1024
                        type: integer
                    type: object
                  mode:
                    description: Mode overrides the application operating mode.
                    properties:
                      profile:
                        description: Profile selects the operating profile.
                        enum:
                        - garage
                        - showroom
                        - strict
                        - friday
                        type: string
                      qualityGate:
                        description: QualityGate selects how strictly quality checks
                          are enforced.
                        enum:
                        - practical
                        - strict
                        type: string
                      rollout:
                        description: Rollout selects the rollout strategy. Only "steady"
                          is supported.
                        enum:
                        - steady
                        type: string
                      shift:
                        description: Shift selects the working shift.
                        enum:
                        - day
                        - night
                        type: string
                    type: object
                  port:
                    description: Port overrides the container port.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  replicas:
                    description: Replicas overrides the application replica count.
                    format: int32
                    maximum: 5
                    minimum: 0
                    type: integer
                type: object
              checks:
                description: Checks selects which policy checks run before the image
                  is applied.
                properties:
                  capacity:
                    default: true
                    description: Capacity validates that the application limit is
                      respected.
                    type: boolean
                  imageReference:
                    default: true
                    description: ImageReference validates that the image reference
                      is well formed.
                    type: boolean
                  policy:
                    default: true
                    description: Policy validates the delivery against the AvtoVAZ
                      factory policy.
                    type: boolean
                type: object
              image:
                description: Image is the already-built image reference to deliver.
                maxLength: 512
                minLength: 1
                type: string
              override:
                description: |-
                  Override acknowledges a guarded change, for example an image change under
                  the "friday" profile.
                properties:
                  approved:
                    description: Approved enables the guarded change.
                    type: boolean
                  image:
                    description: |-
                      Image is the exact image reference the approval applies to. The approval
                      is ignored when it does not match spec.image.
                    type: string
                  reason:
                    description: Reason documents why the change was approved.
                    maxLength: 256
                    type: string
                required:
                - approved
                type: object
              timeouts:
                description: Timeouts bounds the rollout and readiness waits.
                properties:
                  readinessSeconds:
                    default: 180
                    description: ReadinessSeconds bounds the readiness wait after
                      the rollout completes.
                    format: int32
                    maximum: 3600
                    minimum: 10
                    type: integer
                  rolloutSeconds:
                    default: 300
                    description: RolloutSeconds bounds the Deployment rollout wait.
                    format: int32
                    maximum: 3600
                    minimum: 30
                    type: integer
                type: object
              verify:
                description: Verify configures the localhost endpoint check performed
                  after readiness.
                properties:
                  enabled:
                    default: true
                    description: |-
                      Enabled turns the endpoint check on. The check is skipped, not failed,
                      when the controller cannot reach the loopback endpoint of the node.
                    type: boolean
                  expectedStatus:
                    default: 200
                    description: ExpectedStatus is the HTTP status code that counts
                      as success.
                    format: int32
                    maximum: 599
                    minimum: 100
                    type: integer
                  path:
                    default: /healthz
                    description: Path is the HTTP path requested during verification.
                    pattern: ^/.*$
                    type: string
                type: object
            required:
            - appRef
            - image
            type: object
          status:
            description: KonveerStatus reports the observed state of the delivery
              workflow.
            properties:
              appliedImage:
                description: AppliedImage is the image written to the BrunerApp.
                type: string
              completionTime:
                description: CompletionTime is when the workflow reached a terminal
                  phase.
                format: date-time
                type: string
              conditions:
                description: |-
                  Conditions maintains Validated, RolledOut, Verified, Succeeded and
                  Degraded.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the spec generation the status
                  refers to.
                format: int64
                type: integer
              phase:
                description: Phase is the coarse workflow phase.
                enum:
                - Pending
                - Validating
                - Applying
                - RollingOut
                - Verifying
                - Succeeded
                - Failed
                type: string
              stages:
                description: Stages reports every stage of the workflow in execution
                  order.
                items:
                  description: KonveerStageStatus reports one stage of the workflow.
                  properties:
                    completionTime:
                      description: CompletionTime is when the stage finished.
                      format: date-time
                      type: string
                    message:
                      description: Message states the technical condition first, themed
                        wording second.
                      type: string
                    name:
                      description: Name is the stage name, for example "Validate"
                        or "Rollout".
                      type: string
                    startTime:
                      description: StartTime is when the stage started.
                      format: date-time
                      type: string
                    state:
                      description: State is the stage state.
                      enum:
                      - Pending
                      - Running
                      - Succeeded
                      - Failed
                      - Skipped
                      type: string
                  required:
                  - name
                  - state
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              startTime:
                description: StartTime is when the workflow started.
                format: date-time
                type: string
              verifiedEndpoint:
                description: VerifiedEndpoint is the endpoint that answered the verification
                  request.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
