---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: brunernetes-manager
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - bruner.dev
  resources:
  - avtovazs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - bruner.dev
  resources:
  - avtovazs/status
  verbs:
  - get
- apiGroups:
  - bruner.dev
  resources:
  - brunerapps
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - bruner.dev
  resources:
  - brunerapps/finalizers
  verbs:
  - update
- apiGroups:
  - bruner.dev
  resources:
  - brunerapps/status
  verbs:
  - get
  - patch
  - update
