# Factory Showroom - minimal nginx configuration.
# Non-root friendly: listens on 8080, no privileged paths, no PID in /var/run.

worker_processes  1;
error_log  /dev/stderr warn;
pid        /tmp/nginx.pid;

events {
    worker_connections  512;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log  /dev/stdout;
    server_tokens off;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  30;

    # writable temp paths for the non-root nginx user
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   256;
    gzip_comp_level   5;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/xml text/xml;

    server {
        listen       8080;
        listen       [::]:8080;
        server_name  _;

        root  /usr/share/nginx/html;
        index index.html;

        charset utf-8;

        # security headers; the page is fully self contained, so the CSP is strict
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;

        # health endpoint consumed by the BrunerApp probes and the container HEALTHCHECK
        location = /healthz {
            access_log off;
            default_type text/plain;
            add_header Cache-Control "no-store" always;
            try_files /healthz =200;
        }

        location = / {
            add_header Cache-Control "no-cache" always;
            try_files /index.html =404;
        }

        location ~* \.(css|js)$ {
            add_header Cache-Control "public, max-age=3600" always;
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
